<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

<nav class="container">

    <img src="assets/SUCESS (3).png" alt="">

</a>

<ul class="menu">

</ul>

</nav>

</header>


<main class="carrito-container">

<h1>Mi carrito</h1>


<div class="carrito-layout">


<section class="lista-carrito">

<div id="lista-carrito">

</div>

</section>


<aside class="resumen-carrito">

<h2>Resumen de compra</h2>


<div class="linea-resumen">

<span>Subtotal</span>

<strong id="subtotal">
S/ 0.00
</strong>

</div>


<div class="datos-cliente">

<h3>Datos del cliente</h3>


<input
type="text"
id="nombreCliente"
placeholder="Nombre completo">


<input
type="tel"
id="telefonoCliente"
placeholder="Celular">


<textarea
id="direccionCliente"
placeholder="Dirección de entrega"></textarea>

</div>


<div class="acciones-carrito">

<button
id="vaciar"
class="btn-rojo">
Vaciar carrito
</button>


<button
id="whatsapp"
class="btn-verde">
Finalizar compra
</button>

</div>


</aside>

</div>

</main>


<footer>
</footer>


<script src="js/carritoVista.js"></script>

</body>
