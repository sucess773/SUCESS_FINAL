⚙️ Panel Administrador SUCESS

<section class="admin-form">


<h2>
Agregar figurita
</h2>



<div class="form-grid">


<input 
id="nombre"
placeholder="Nombre del jugador">



<input 
id="codigo"
placeholder="Código">



<input 
id="pais"
placeholder="País">





<select id="categoria">

<option>

<option>

<option>

<option>

</option>

<option>

</option>

<option value="">

</option>

<option>
Común
</option>

<option>
Especial
</option>

<option>
Legendaria
</option>

<option>
Oro
</option>

</select>





<input 
id="coleccion"
placeholder="Colección">





<input 
id="precio"
type="number"
placeholder="Precio">





<input 
id="stock"
type="number"
placeholder="Stock">





<label class="subir-imagen">

📷 Seleccionar imagen


<input 
type="file"
id="imagen"
accept="image/*">


</label>



</div>





<button 
id="guardar-producto"
class="btn-admin">
